name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le projet
        run: |
          mkdir www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          npx cap init "Arrow Puzzle" com.votrenom.arrowpuzzle --web-dir www
          npx cap add android
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Compiler l APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arrow-puzzle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
