name: Release AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le projet
        run: |
          mkdir www && cp index.html www/index.html
          sed -i 's/const ADS={test:true/const ADS={test:false/' www/index.html
          grep -q 'const ADS={test:false' www/index.html
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob
          npx cap init "Flèchix" com.flechix.puzzle --web-dir www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8913332477594973~6706734838"/></application>#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" /><application#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          npx cap sync android
      - name: Construire le bundle
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - name: Signer le bundle
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > flechix.jks
          cp android/app/build/outputs/bundle/release/app-release.aab flechix.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore flechix.jks -storepass "$KS_PASS" flechix.aab flechix
          jarsigner -verify flechix.aab | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: flechix-aab
          path: flechix.aab
